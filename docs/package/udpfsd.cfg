# udpfsd.cfg - read from the folder that contains the udpfsd program.
# Relative paths are relative to that folder. Put a # in front of a line
# to turn it off.

# ---- Games -------------------------------------------------------------
# Folders with .iso / .zso / .cso / .chd images (subfolders included).
# An image split into Name.iso.001, Name.iso.002, ... counts as one
# Name.iso. The DESR sees them read-only. Images in DVD are DVD games,
# images in CD are CD games.
# By default these are the folders next to this file; you can point them
# anywhere instead, e.g.  dvd = D:\PS2\DVD
dvd      = DVD
cd       = CD
#games   = D:\PS2\Games
#install = D:\PS2\ToInstall

# ---- Game settings and covers (optional) -------------------------------
# OPL per-game settings (<GAME-ID>.cfg) and covers and other OPL art
# (<GAME-ID>_COV.jpg/png, _COV2, _ICO, _LAB, _LGO, _BG_00, _SCR_00, _SCR_01),
# e.g. the CFG and ART folders of PFS-BatchKit-Manager. JPEG art is handed
# to OPL as PNG.
cfg      = CFG
art      = ART

# PS1 games (.VCD) and the POPStarter files (POPSTARTER.KELF, POPS.ELF,
# IOPRP252.IMG), served to the DESR as /POPS. A PS1 BIN/CUE (one .bin)
# here or in CD is served as Name.VCD, converted on the fly like cue2pops.
pops     = POPS

# Homebrew apps (.ELF), served to the DESR as /APPS. One app per
# subfolder (its ELF plus the files it needs), or a lone .ELF.
apps     = APPS

# Memory cards and saves, served to the DESR as /VMC:
#   PS2: OPL VMC images <GAME-ID>_0.bin / <GAME-ID>_1.bin (or any .bin),
#        PCSX2 .ps2 memory cards, .psu saves
#   PS1: memory cards <GAME-ID>.VMC / .mcr / .mcd / .mc / .gme / .vmp,
#        single saves .mcs
vmc      = VMC

# Cheats, served to the DESR as /CHT: OPL cheats <GAME-ID>.cht, PS1
# (POPStarter) cheats <GAME-ID>.txt.
cht      = CHT

# Game ID -> name list (e.g. PFS-BatchKit-Manager's GameListPS2.txt).
# Copy it next to this file and remove the #.
#gamelist = GameListPS2.txt

# XMB game info (release date, developer, publisher, genre) from a game
# database, e.g. PFS-BatchKit-Manager's BAT\PS2DB.xml. Copy it next to this
# file and remove the #.
#gamedb = PS2DB.xml

# Download covers that are not in ART (from xlenore/ps2-covers on GitHub)
download_covers = yes

# ---- Files the DESR receives (keep them next to this file) ---------------
# OPL-Launcher, copied into every game's XMB channel
opl_launcher = opl-launcher-EXECUTE.KELF
# Open PS2 Loader, installed on the DESR only if it has none
opl_elf = OPNPS2LD.ELF

# Prepared covers and game list (created automatically)
cache    = udpfsd-cache

# ---- Behaviour -----------------------------------------------------------
# yes: the DESR installs every new game by itself, no buttons needed.
# no:  you pick the games on the DESR.
auto_install = yes
# yes: switch the DESR off when auto-install has finished (15 s to cancel).
power_off_after_install = no

read_only = yes

# PC with Wi-Fi and cable at the same time: set the PC's wired LAN IP.
#bind = 192.168.1.100
#port = 62966
