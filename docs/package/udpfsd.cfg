# udpfsd.cfg - read from the folder that contains the udpfsd program.
# Relative paths are relative to that folder. Put a # in front of a line
# to turn it off.

# ---- Games -------------------------------------------------------------
# Folders with .iso / .zso images (subfolders included). The DESR sees
# them read-only. Images in DVD are DVD games, images in CD are CD games.
# By default these are the folders next to this file; you can point them
# anywhere instead, e.g.  dvd = D:\PS2\DVD
dvd      = DVD
cd       = CD
#games   = D:\PS2\Games
#install = D:\PS2\ToInstall

# ---- Game settings and covers (optional) -------------------------------
# OPL per-game settings (<GAME-ID>.cfg) and covers (<GAME-ID>_COV.jpg/png),
# e.g. the CFG and ART folders of PFS-BatchKit-Manager.
cfg      = CFG
art      = ART

# PS1 games (.VCD) and the POPStarter files (POPSTARTER.KELF, POPS.ELF,
# IOPRP252.IMG), served to the DESR as /POPS.
pops     = POPS

# Game ID -> name list (e.g. PFS-BatchKit-Manager's GameListPS2.txt).
# Copy it next to this file and remove the #.
#gamelist = GameListPS2.txt

# Download covers that are not in ART (from xlenore/ps2-covers on GitHub)
download_covers = yes

# ---- Files the DESR receives (keep them next to this file) ---------------
# OPL-Launcher, copied into every game's XMB channel
opl_launcher = opl-launcher-EXECUTE.KELF
# Open PS2 Loader, installed on the DESR only if it has none
opl_elf = OPNPS2LD.ELF

# Prepared covers and game list (created automatically)
cache    = udpfsd-cache

# ---- Behaviour -----------------------------------------------------------
# yes: the DESR installs every new game by itself, no buttons needed.
# no:  you pick the games on the DESR.
auto_install = yes

read_only = yes

# PC with Wi-Fi and cable at the same time: set the PC's wired LAN IP.
#bind = 192.168.1.100
#port = 62966
