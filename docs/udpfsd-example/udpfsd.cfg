# udpfsd.cfg - read from the folder that contains the udpfsd binary.
# Relative paths are relative to that folder. Remove or comment a line to
# disable it. Command-line flags and environment variables override these.

# Game folders (.iso / .zso, subfolders included), served read-only to the
# PS2 as /DVD, /CD, /GAMES and /INSTALL. Folder names CD/DVD set the disc type.
dvd      = F:\ps2\PFS-BatchKit-Manager\DVD
cd       = F:\ps2\PFS-BatchKit-Manager\CD
#games   = F:\ps2\Games
#install = F:\ps2\ToInstall

# OPL per-game configs and art (CFG\<ID>.cfg, ART\<ID>_COV.jpg ...)
cfg      = F:\ps2\PFS-BatchKit-Manager\CFG
art      = F:\ps2\PFS-BatchKit-Manager\ART

# ID -> name reference list (e.g. PFS-BatchKit-Manager's GameListPS2.txt)
#gamelist = GameListPS2.txt

# PS1 games (.VCD) + POPSTARTER.KELF, POPS.ELF, IOPRP252.IMG (served as /POPS)
#pops = F:\ps2\PFS-BatchKit-Manager\POPS

# Prepared jackets, manifest and scan cache
cache    = udpfsd-cache

# Download covers missing from ART (xlenore/ps2-covers on GitHub)
download_covers = yes

# OPL-Launcher copied into every new XMB game channel
opl_launcher = opl-launcher-EXECUTE.KELF

# Open PS2 Loader installed on the console when it has none
# (shipped: official OPL v1.2.0-Beta-2245-3e3f34e)
opl_elf = OPNPS2LD.ELF

# Install every new game automatically when the installer starts
auto_install = yes

read_only = yes
#port = 62966
#bind = 192.168.1.100
